<!doctype html>
<html lang="en">

    <title>MineClaw · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;

        background: #0c0e12;
        color: #f5f6f8;

          sans-serif;

        max-width: 30rem;

      }

        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        color: #3ad19a;
      }

        font-size: 1.6rem;

  <body>
    <main>
      <h1>The colony is offline</h1>
      <p>
