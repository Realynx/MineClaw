{{- /*
The bridge HMAC key and the Supervisor token: generated on install, then read back with `lookup` so upgrades keep them
(`helm template` / --dry-run without a cluster render fresh random values). Plus the Anthropic key when given as a value.
*/ -}}
{{- if or (not .Values.secrets.existingSecret) .Values.anthropic.apiKey }}
{{- $name := printf "%s-secrets" (include "mineclaw.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data | default dict }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mineclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
  {{- if not .Values.secrets.existingSecret }}
  bridge-key: {{ index $data "bridge-key" | default (randAlphaNum 64 | b64enc) | quote }}
  supervisor-token: {{ index $data "supervisor-token" | default (randAlphaNum 64 | b64enc) | quote }}
  {{- end }}
  {{- if .Values.anthropic.apiKey }}
  anthropic-api-key: {{ .Values.anthropic.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
