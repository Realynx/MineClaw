# CI install on kind (deploy/helm/test/ci-kind-test.sh): images loaded with `kind load docker-image` (never pulled), no
# ingress, small volumes and requests so it fits a GitHub runner. The test script sets the image repositories and tags.
image:
  server:
    pullPolicy: IfNotPresent
  web:
    pullPolicy: IfNotPresent

persistence:
  keepOnUninstall: false
  data:
    size: 1Gi
  web:
    size: 64Mi
  logs:
    sizeLimit: 256Mi

ingress:
  enabled: false

bot:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 2Gi }
bridge:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 768Mi }
web:
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 1Gi }

terminationGracePeriodSeconds: 30
